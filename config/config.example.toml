# Optional configuration for specific LLM models
[llm.vision]
model = "claude-3-7-sonnet-20250219"       # The vision model to use
base_url = "https://api.anthropic.com/v1/" # API endpoint URL for vision model
api_key = "YOUR_API_KEY"                   # Your API key for vision model
max_tokens = 8192                          # Maximum number of tokens in the response
temperature = 0.0                          # Controls randomness for vision model

# [llm.vision] #OLLAMA VISION:
# api_type = 'ollama'
# model = "llama3.2-vision"
# base_url = "http://localhost:11434/v1"
# api_key = "ollama"
# max_tokens = 4096
# temperature = 0.0

# Optional GUI vision model — used as a fallback when browser_use DOM element
# recognition fails (no interactive elements, custom date/map/canvas widgets).
# The browser tool's action="gui_action" screenshots the page and asks this
# model for a pixel-coordinate atomic action. Falls back to [llm.vision], then to
# env DASHSCOPE_API_KEY with model "gui-plus", if this section is omitted.
# The model is expected to return absolute pixel coordinates relative to the
# screenshot image; the browser tool scales them to viewport CSS pixels.
# [llm.gui]
# api_type = 'openai'
# model = "qwen3.7-plus"                                          # DashScope vision model
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# api_key = "YOUR_DASHSCOPE_API_KEY"
# max_tokens = 2048
# temperature = 0.0

# 白底主体提取（批量采集：图搜查询图预处理）——app/collect/image_extract.py
# Temu 主图常是营销拼图，直接以图搜 recall 差。启用后先用生图模型（packyapi 的
# gpt-image-2 /images/edits）把主图重绘成「纯白背景 + 单一商品」的干净图当【搜索
# 查询图】，配合商品标题约束保留哪一件；判同款仍用原图（生成误差只影响 recall 不影响
# 精度）。全部走环境变量，不在此 toml 配（避免 config.py 把空 key 回退成 DASHSCOPE）：
#   PACKY_API_KEY        必填，packyapi 的 Bearer token；未设则跳过白底提取、退回原图搜
#   PACKY_BASE_URL       选填，默认 https://www.packyapi.com/v1
#   PACKY_IMAGE_MODEL    选填，默认 gpt-image-2
#   PACKY_IMAGE_SIZE     选填，默认 1024x1024
#   PACKY_IMAGE_QUALITY  选填，默认 medium（搜索查询图够用；成本杠杆，别默认 high）

# Optional configuration for specific browser configuration
# [browser]
# Whether to run browser in headless mode (default: false)
#headless = false
# Viewport size in CSS pixels. Leave unset to use browser_use default 1280x1100.
# Set these to match your real screen's usable area (e.g. 1920x953) so the DOM's
# in-viewport visibility check stays consistent with the screenshot the GUI vision
# model sees — a mismatch makes the model click on elements that are off-screen.
#window_width = 1920
#window_height = 953
# Disable browser security features (default: true)
#disable_security = true
# Extra arguments to pass to the browser
#extra_chromium_args = []
# Path to a Chrome instance to use to connect to your normal browser
# e.g. '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
#chrome_instance_path = ""
# Connect to a browser instance via WebSocket
#wss_url = ""
# Connect to a browser instance via CDP
#cdp_url = ""

# Optional configuration, Proxy settings for the browser
# [browser.proxy]
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Optional configuration, Search settings.
# [search]
# Search engine for agent to use. Default is "Google", can be set to "Baidu" or "DuckDuckGo" or "Bing".
#engine = "Google"
# Fallback engine order. Default is ["DuckDuckGo", "Baidu", "Bing"] - will try in this order after primary engine fails.
#fallback_engines = ["DuckDuckGo", "Baidu", "Bing"]
# Seconds to wait before retrying all engines again when they all fail due to rate limits. Default is 60.
#retry_delay = 60
# Maximum number of times to retry all engines when all fail. Default is 3.
#max_retries = 3
# Language code for search results. Options: "en" (English), "zh" (Chinese), etc.
#lang = "en"
# Country code for search results. Options: "us" (United States), "cn" (China), etc.
#country = "us"


## Sandbox configuration
#[sandbox]
#use_sandbox = false
#image = "python:3.12-slim"
#work_dir = "/workspace"
#memory_limit = "1g"  # 512m
#cpu_limit = 2.0
#timeout = 300
#network_enabled = true

# MCP (Model Context Protocol) configuration
[mcp]
server_reference = "app.mcp.server" # default server module reference

# Optional Runflow configuration
# Your can add additional agents into run-flow workflow to solve different-type tasks.
[runflow]
use_data_analysis_agent = false     # The Data Analysi Agent to solve various data analysis tasks

# Optional RAG experience library — distill successful task flows and retrieve the
# most similar ones (hybrid dense + BM25 + RRF) to inject as few-shot on new runs,
# so the agent takes fewer detours. Write entry: interactive [y/N] confirm after a
# successful run; non-interactive runs (e.g. --prompt scripts) skip saving.
# To edit/delete an entry, hand-edit experience/recipes.jsonl (human-readable).
# Requires: pip install faiss-cpu rank-bm25 jieba
# [experience]
# enabled = true
# embedding_model = "text-embedding-v4"  # embedding model; build & query must match
# top_k = 2                              # how many similar recipes to inject
# min_score = 0.35                       # relevance floor gate
# rrf_k = 60                             # reciprocal rank fusion constant

# 活动管理管线（Temu 关流量加速器 → 报活动 → 开加速器）默认参数。
# 毛利率红线三级回退：此处全局默认 → 本批运行值(web/CLI) → SPU清单逐品覆盖(spu:margin)。
[activity]
# 最低毛利率红线：申报价须保证 (申报价-成本)/申报价 >= 此值，否则跳过不报（skip_redline）。
min_margin = 0.15
# 申报价策略：'discount_ceiling'=贴活动折扣上限取最高价（守利润同时少让利）。
price_strategy = "discount_ceiling"
