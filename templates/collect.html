<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>批量采集 · Temu → 1688 → Excel</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <link href="/static/bootstrap.min.css" rel="stylesheet" />
    <link
      href="https://gcore.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: var(--bs-body-bg);
      }
      .stat-card {
        border: 1px solid var(--bs-border-color);
        border-radius: 0.75rem;
      }
      .stat-num {
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1.1;
      }
      /* 进度日志：等宽、可滚动，实时 append */
      #eventLog {
        height: 240px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        background: var(--bs-tertiary-bg);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
      }
      #eventLog .line {
        white-space: pre-wrap;
        word-break: break-all;
      }
      .worklist-table {
        font-size: 0.85rem;
      }
      .worklist-table td,
      .worklist-table th {
        vertical-align: middle;
      }
      .thumb {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 0.25rem;
        background: var(--bs-tertiary-bg);
      }
      .table-scroll {
        max-height: 520px;
        overflow-y: auto;
      }
      .cell-ellipsis {
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-3">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
          <i class="bi bi-box-seam me-1"></i> 批量采集
          <small class="text-muted fs-6">Temu → 1688 → Excel</small>
        </span>
        <div class="ms-auto">
          <a href="/" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-chat-dots"></i> 返回对话
          </a>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
      <!-- Excel 占用告警（仅本地 xlsx 模式；云端模式 service 不返回 excel_locked） -->
      <div id="lockAlert" class="alert alert-warning d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        Excel 正被 WPS/Excel 占用，采集将无法写入。请先关闭该文件。
      </div>

      <!-- 协作文档读取失败告警（云端模式） -->
      <div id="cloudAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- 统计卡片 -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <div class="stat-card p-3 text-center">
            <div class="stat-num" id="statTotal">–</div>
            <div class="text-muted small">清单总量</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card p-3 text-center">
            <div class="stat-num text-success" id="statDone">–</div>
            <div class="text-muted small">已入库</div>
          </div>
        </div>
        <div class="col-12 col-md-3">
          <div class="stat-card p-3 text-center">
            <div class="text-muted small mb-1">待采</div>
            <div class="d-flex justify-content-center gap-4">
              <div>
                <div class="stat-num text-primary" id="statTodoSpu">–</div>
                <div class="text-muted small">SPU 总数</div>
              </div>
              <div>
                <div class="stat-num text-primary" id="statTodoSku">–</div>
                <div class="text-muted small">SKU 数量</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card p-3 text-center">
            <div class="stat-num" id="statBatch">0</div>
            <div class="text-muted small">本批处理</div>
          </div>
        </div>
      </div>

      <!-- 目标选择：工作簿 → Sheet → 店铺（级联） -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-12">
              <!-- 本地/线上切换：kdocs 有配额，用满了要能立刻切回本地表继续干活。
                   两侧各记一份目标，来回切不用重填对面那个路径 -->
              <label class="form-label small text-muted mb-1">文档模式</label>
              <div class="btn-group btn-group-sm w-100 mb-2" role="group">
                <input
                  type="radio"
                  class="btn-check"
                  name="docMode"
                  id="docModeLocal"
                  value="local"
                  autocomplete="off"
                />
                <label class="btn btn-outline-primary" for="docModeLocal">
                  <i class="bi bi-hdd"></i> 本地文档
                  <span class="d-none d-md-inline text-body-tertiary small">
                    （自动搜桌面表格）
                  </span>
                </label>
                <input
                  type="radio"
                  class="btn-check"
                  name="docMode"
                  id="docModeCloud"
                  value="cloud"
                  autocomplete="off"
                />
                <label class="btn btn-outline-primary" for="docModeCloud">
                  <i class="bi bi-cloud"></i> 线上文档
                  <span class="d-none d-md-inline text-body-tertiary small">
                    （金山协作表格）
                  </span>
                </label>
              </div>
            </div>
            <div class="col-12 col-md-5">
              <label class="form-label small text-muted mb-1">
                目标工作簿
                <span class="text-body-tertiary">（本地 xlsx 路径，或粘贴协作文档链接）</span>
              </label>
              <!-- input+datalist 而不是 select：允许直接粘贴 kdocs 链接，候选仅作回显 -->
              <div class="input-group input-group-sm">
                <input
                  id="inputExcel"
                  type="text"
                  class="form-control form-control-sm"
                  list="excelOptions"
                  placeholder="C:\...\核算表.xlsx 或 https://www.kdocs.cn/l/..."
                />
                <button
                  id="btnSaveCloudDoc"
                  type="button"
                  class="btn btn-outline-secondary"
                  title="把当前协作文档链接登记到本地（可起名字），下次直接从候选里选"
                >
                  <i class="bi bi-bookmark-star"></i>
                </button>
              </div>
              <datalist id="excelOptions"></datalist>
              <div id="excelHint" class="small text-body-tertiary mt-1"></div>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">目标 Sheet</label>
              <select id="selSheet" class="form-select form-select-sm"></select>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-muted mb-1">店铺</label>
              <select id="selStore" class="form-select form-select-sm"></select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">写入位置</label>
              <select
                id="selAppend"
                class="form-select form-select-sm"
                title="新行写到哪里：追加到末尾（默认）/ 插到表头下 / 从指定行向下插 / 从指定行向上插"
              ></select>
            </div>
            <div class="col-6 col-md-2 d-none" id="wrapAppendRow">
              <label class="form-label small text-muted mb-1">起始行</label>
              <input
                type="number"
                id="inputAppendRow"
                class="form-control form-control-sm"
                min="2"
                placeholder="如 10"
                title="向下插：新行从该行开始，原内容下移。向上插：新行排在该行之前"
              />
            </div>
          </div>
          <div id="appendHint" class="small text-body-tertiary mt-2"></div>
        </div>
      </div>

      <!-- 控制条 -->
      <div class="card mb-3">
        <div class="card-body d-flex flex-wrap gap-2 align-items-center">
          <div class="input-group input-group-sm" style="width: 260px">
            <span class="input-group-text">采集范围</span>
            <select
              id="selStatus"
              class="form-select"
              title="默认「跟随页面当前」：页签+类目/站点/商品名等筛选都在 Temu 页面设好，枚举时点页面「查询」原样采集。选具体页签则先替你切该页签（可能重置详细筛选）"
            ></select>
          </div>
          <!-- 留空（默认）＝完全不碰浏览器：每个列表页签按自己所在的域名归类，同时开着
               全球和美国的页签也能一次采完。选具体区域＝主动把页签切过去（换域名的整页跳转，
               见 app/temu_region.py） -->
          <div class="input-group input-group-sm" style="width: 240px">
            <span class="input-group-text">区域</span>
            <select
              id="selRegion"
              class="form-select"
              title="默认「不切换」：采集就在你已打开的页签里进行，页签在哪个区域就采哪个区域，可同时开多个区域的页签。选具体区域＝枚举前先把这些页签切过去"
            ></select>
          </div>
          <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-repeat"></i> 重新枚举清单
          </button>
          <div class="vr d-none d-md-block"></div>
          <div class="input-group input-group-sm" style="width: 160px">
            <span class="input-group-text">数量</span>
            <input
              type="number"
              id="inputLimit"
              class="form-control"
              value="20"
              min="1"
              max="500"
            />
          </div>
          <div class="form-check form-switch ms-1">
            <input class="form-check-input" type="checkbox" id="switchAuto1688" />
            <label
              class="form-check-label small"
              for="switchAuto1688"
              title="关：只采 Temu 基础信息，采购价/重量留空待人工填。开：跑 1688 图搜自动采价"
              >1688 自动采价</label
            >
          </div>
          <div class="form-check form-switch ms-1 d-none" id="pipelineWrap">
            <input
              class="form-check-input"
              type="checkbox"
              id="switchPipeline"
              checked
            />
            <label class="form-check-label small" for="switchPipeline"
              >确定性管道</label
            >
          </div>
          <button id="btnStart" class="btn btn-primary btn-sm">
            <span
              id="startSpinner"
              class="spinner-border spinner-border-sm d-none"
              role="status"
            ></span>
            <i class="bi bi-play-fill"></i> 开始采集
          </button>
          <span id="statusText" class="text-muted small ms-2"></span>
        </div>
      </div>

      <!-- 进度条 + 事件日志 -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between small text-muted mb-1">
            <span>本批进度</span>
            <span id="progressLabel">0 / 0</span>
          </div>
          <div class="progress mb-3" style="height: 8px">
            <div
              id="progressBar"
              class="progress-bar"
              role="progressbar"
              style="width: 0%"
            ></div>
          </div>
          <div id="eventLog"></div>
        </div>
      </div>

      <!-- 清单表格 -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-list-ul"></i> 工作清单</span>
          <div class="btn-group btn-group-sm" role="group">
            <input type="radio" class="btn-check" name="flt" id="fltTodo" checked />
            <label class="btn btn-outline-secondary" for="fltTodo">待采</label>
            <input type="radio" class="btn-check" name="flt" id="fltDone" />
            <label class="btn btn-outline-secondary" for="fltDone">已入库</label>
            <input type="radio" class="btn-check" name="flt" id="fltAll" />
            <label class="btn btn-outline-secondary" for="fltAll">全部</label>
          </div>
        </div>
        <div class="table-scroll">
          <table class="table table-sm table-hover worklist-table mb-0">
            <thead class="sticky-top bg-body">
              <tr>
                <th style="width: 48px"></th>
                <th style="width: 110px">SPU</th>
                <th>商品名</th>
                <th style="width: 110px">店铺</th>
                <th style="width: 90px">售价</th>
                <th style="width: 90px">状态</th>
                <th style="width: 130px">采购价/运费</th>
              </tr>
            </thead>
            <tbody id="worklistBody">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">加载中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto" id="toastTitle">提示</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
      </div>
    </div>

    <script src="/static/bootstrap.bundle.min.js"></script>
    <script>
      // 采集页前端：全部走 /collect/* 接口，进度经 SSE 消费 service 抛出的结构化事件。
      const $ = (id) => document.getElementById(id);
      let items = []; // 当前清单（含每条 done 状态）
      let priced = {}; // spu -> {status, purchase_price, shipping}（本批实时结果覆盖）
      let evtSource = null;
      // 三级选择当前值（后端回显「上次选择」作初值）+ 新行落点
      let sel = {
        excel: "",
        sheet: "",
        store: "",
        status: "",
        region: "", // 目标区域；空串＝跟随浏览器当前区域
        append_mode: "bottom",
        append_row: "",
      };

      // 区域名等文本进 HTML 前转义（区域名来自页面读取，不是常量）
      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      }

      // 起始行输入框只在「从指定行」两种模式下出现；顺带给出一句人读的落点说明，
      // 避免用户把「向下插」和「向上插」记反（差别只在指定行本身要不要被推走）。
      function syncAppendUI() {
        const needRow =
          sel.append_mode === "row_down" || sel.append_mode === "row_up";
        $("wrapAppendRow").classList.toggle("d-none", !needRow);
        const r = String(sel.append_row || "").trim() || "R";
        const hints = {
          bottom: "新行追加到数据区末尾（现有内容不动）。",
          top: "新行插到表头正下方，已有数据整体下移。",
          row_down: `新行从第 ${r} 行开始占位，原第 ${r} 行及以下整体下移。`,
          row_up: `新行排在第 ${r} 行之前（该行内容不变、行号变大）。`,
        };
        let msg = hints[sel.append_mode] || "";
        if (needRow && !String(sel.append_row || "").trim()) {
          msg += " 未填起始行时本批会退回「追加到末尾」。";
        }
        $("appendHint").textContent = msg;
      }

      function showToast(title, body, kind = "primary") {
        $("toastTitle").textContent = title;
        $("toastBody").textContent = body;
        const el = $("toast");
        el.className = `toast text-bg-${kind}`;
        new bootstrap.Toast(el, { delay: 4000 }).show();
      }

      function logLine(text, cls = "") {
        const box = $("eventLog");
        const div = document.createElement("div");
        div.className = "line " + cls;
        const t = new Date().toLocaleTimeString();
        div.textContent = `[${t}] ${text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      function currentFilter() {
        if ($("fltDone").checked) return "done";
        if ($("fltAll").checked) return "all";
        return "todo";
      }

      function statusBadge(it) {
        const p = priced[it.spu];
        if (p) {
          if (p.status === "ok")
            return '<span class="badge text-bg-success">本批✓</span>';
          if (p.status === "base")
            return '<span class="badge text-bg-info">待人工填</span>';
          if (p.status === "empty")
            return '<span class="badge text-bg-warning">无同款</span>';
          return '<span class="badge text-bg-danger">失败</span>';
        }
        return it.done
          ? '<span class="badge text-bg-secondary">已入库</span>'
          : '<span class="badge text-bg-light text-dark">待采</span>';
      }

      function priceCell(it) {
        const p = priced[it.spu];
        if (p && p.purchase_price != null) {
          const ship = p.shipping != null ? ` +￥${p.shipping}` : "";
          return `￥${p.purchase_price}${ship}`;
        }
        return '<span class="text-muted">–</span>';
      }

      function renderTable() {
        const flt = currentFilter();
        const rows = items.filter((it) =>
          flt === "all" ? true : flt === "done" ? it.done : !it.done
        );
        const body = $("worklistBody");
        if (!rows.length) {
          body.innerHTML =
            '<tr><td colspan="7" class="text-center text-muted py-4">无数据</td></tr>';
          return;
        }
        body.innerHTML = rows
          .map((it) => {
            const img = it.image
              ? `<img class="thumb" src="${it.image}" loading="lazy" />`
              : '<div class="thumb"></div>';
            // 店铺列带上区域：同一账号在全球/美国区店名完全相同，不标区域就分不清
            // 这一行是哪个区域采来的
            const storeName = it.store || it.mallid || "";
            const store = it.region_label
              ? `${storeName} · ${it.region_label}`
              : storeName;
            return `<tr data-spu="${it.spu}">
              <td>${img}</td>
              <td class="small text-muted">${it.spu}</td>
              <td class="cell-ellipsis" title="${it.name || ""}">${it.name || ""}</td>
              <td class="small cell-ellipsis" title="${store}">${store}</td>
              <td class="small">${it.price || ""}</td>
              <td>${statusBadge(it)}</td>
              <td class="small">${priceCell(it)}</td>
            </tr>`;
          })
          .join("");
      }

      function renderStats(s) {
        $("statTotal").textContent = s.total;
        $("statDone").textContent = s.done == null ? "–" : s.done;
        $("statTodoSpu").textContent = s.todo_spu ?? s.todo;
        $("statTodoSku").textContent = s.todo_sku ?? s.todo;
        $("lockAlert").classList.toggle("d-none", !s.excel_locked);
        // 云端模式读失败（kdocs-cli 没装上/未认证/链接无效）→ 红条直接显示原因
        $("cloudAlert").classList.toggle("d-none", !(s.cloud && s.cloud_error));
        if (s.cloud && s.cloud_error) {
          $("cloudAlert").textContent = `协作文档读取失败：${s.cloud_error}`;
        }
      }

      function fillSelectors(s) {
        // 工作簿是 input+datalist：datalist 放扫描到的本地 .xlsx 候选 + 已登记的
        // 协作文档链接（带名字），当前值（本地路径或粘贴的链接）直接回填进输入框
        $("excelOptions").innerHTML =
          (s.workbooks || [])
            .map((p) => `<option value="${p}"></option>`)
            .join("") +
          cloudDocs
            .map(
              (d) =>
                `<option value="${d.url}"${
                  d.name ? ` label="${d.name}"` : ""
                }></option>`
            )
            .join("");
        $("inputExcel").value = s.excel || "";
        // 云端目标给个明确标识，避免把链接当成本地路径误解；本地模式没选到表时提示去选
        // （后端刻意不猜——写错表要人工回滚）
        $("excelHint").textContent = s.cloud
          ? "协作文档（在线表格）"
          : s.excel
          ? ""
          : "请从下拉候选里选一个本地工作簿（桌面上的 xlsx 已列出）";

        // Sheet 下拉：选中工作簿的所有表；首项为「请选择」
        const sheetSel = $("selSheet");
        sheetSel.innerHTML =
          `<option value="">— 请选择 —</option>` +
          (s.sheets || [])
            .map(
              (n) =>
                `<option value="${n}"${n === s.sheet ? " selected" : ""}>${n}</option>`
            )
            .join("");

        // 店铺下拉：全部 + 各店（label + 商品数）
        const storeSel = $("selStore");
        storeSel.innerHTML =
          `<option value="">全部店铺</option>` +
          (s.stores || [])
            .map(
              (st) =>
                `<option value="${st.key}"${
                  st.key === s.store ? " selected" : ""
                }>${st.label}（${st.count}）</option>`
            )
            .join("");

        // 写入位置下拉：选项由后端给（与 APPEND_MODE_LABELS 同源，勿在前端重复维护）
        sel.append_mode = s.append_mode || "bottom";
        sel.append_row = s.append_row || "";
        $("selAppend").innerHTML = (s.append_modes || [])
          .map(
            (m) =>
              `<option value="${m.key}"${
                m.key === sel.append_mode ? " selected" : ""
              }>${m.label}</option>`
          )
          .join("");
        $("inputAppendRow").value = sel.append_row;
        syncAppendUI();

        // 采集范围下拉：首项「跟随页面当前」(value="") 为默认，其后是可选覆盖页签
        const statusSel = $("selStatus");
        const cur = s.status || "";
        statusSel.innerHTML =
          `<option value=""${cur === "" ? " selected" : ""}>跟随页面当前（含类目/站点/商品名等）</option>` +
          (s.status_tabs || [])
            .map(
              (t) =>
                `<option value="${t}"${t === cur ? " selected" : ""}>切到「${t}」</option>`
            )
            .join("");

        renderRegionSelect(s);
      }

      // 区域下拉：候选只能从页面读（账号能看到哪些区域随权限变，代码里写死就是猜）。
      // 首项 value="" ＝不切换，各页签按自己所在区域采；其余是顶栏实际可见的区域。
      // 「商家中心」不是业务区域（没有商品列表），从候选里剔掉，免得选了采不到东西。
      // 读不到候选不影响采集：区域归类走页签域名，这个下拉只是「主动切区域」的入口。
      function renderRegionSelect(s) {
        const box = $("selRegion");
        if (!box) return;
        const r = s.region || {};
        const want = s.region_label || "";
        const opts = (r.options || []).filter((x) => x !== "商家中心");
        const curTip = r.current ? `不切换（当前 ${r.current}）` : "不切换（按页签所在区域）";
        box.innerHTML =
          `<option value=""${want === "" ? " selected" : ""}>${esc(curTip)}</option>` +
          opts
            .map(
              (t) =>
                `<option value="${esc(t)}"${t === want ? " selected" : ""}>${esc(t)}</option>`
            )
            .join("");
        // 读不到区域名时把原因挂在 title 上，不弹红条：采集不依赖它（区域归类走页签域名），
        // 读不到只是没法在这里主动切区域而已
        box.title = r.error
          ? `读不到区域名：${r.error}。不影响采集——采集按页签所在域名归类；`
            + `想主动切区域才需要它，请在调试 Chrome 里打开 Temu 后台页面`
          : "默认「不切换」：采集就在你已打开的页签里进行。选具体区域＝枚举前先把页签切过去";
      }

      // 当前选中的文档模式；首屏未渲染时返回空串＝让后端按上次选择决定
      function docMode() {
        return document.querySelector('input[name="docMode"]:checked')?.value || "";
      }

      async function loadWorklist({ syncCollectLimit = false } = {}) {
        try {
          const qs = new URLSearchParams({
            excel: sel.excel,
            sheet: sel.sheet,
            store: sel.store,
            // 每次都带上：否则切过模式后再切 Sheet，后端会按 prefs 里的旧模式解析
            doc_mode: docMode(),
          });
          const r = await fetch("/collect/worklist?" + qs.toString());
          const s = await r.json();
          items = s.items || [];
          lastStatus = s; // 缓存，供登记链接后不重拉清单直接重渲候选
          // 用后端回显的生效值同步本地选择（首屏即「上次选择」）
          sel.excel = s.excel || "";
          sel.sheet = s.sheet || "";
          sel.store = s.store || "";
          sel.status = s.status || "";
          sel.region = s.region_label || "";
          // 回显后端实际生效的模式（本地模式下 excel 可能是自动挑的桌面候选）
          $(s.doc_mode === "cloud" ? "docModeCloud" : "docModeLocal").checked = true;
          fillSelectors(s);
          renderStats(s);
          if (syncCollectLimit) {
            const maxCollectible = Math.max(0, Number(s.todo_sku ?? s.todo) || 0);
            $("inputLimit").max = String(Math.max(1, maxCollectible));
            $("inputLimit").value = String(maxCollectible);
          }
          renderTable();
          updateStartEnabled();
        } catch (e) {
          showToast("加载失败", String(e), "danger");
        }
      }

      // 未选 Sheet 时禁用「开始采集」（无处判重/写入）
      function updateStartEnabled() {
        const noSheet = !sel.sheet;
        const noTodo = Number(lastStatus?.todo_sku ?? lastStatus?.todo ?? 0) <= 0;
        $("btnStart").disabled = noSheet || noTodo;
        $("btnStart").title = noSheet
          ? "请先选目标 Sheet"
          : noTodo
          ? "当前没有待采 SKU"
          : "";
      }

      // ---- 事件处理：把 service 的结构化事件映射到 UI ----
      function onEvent(type, data) {
        if (type === "batch_start") {
          $("statBatch").textContent = data.batch;
          $("progressLabel").textContent = `0 / ${data.batch}`;
          $("progressBar").style.width = "0%";
          const posLabel = {
            bottom: "追加到末尾",
            top: "插到表头下",
            row_down: "从指定行向下插",
            row_up: "从指定行向上插",
          }[data.append_mode] || "";
          logLine(
            `批次开始：清单 ${data.total}，已入库 ${data.done_existing}，待采 ${data.todo}，本批 ${data.batch}` +
              (posLabel ? `，写入位置=${posLabel}` : ""),
            "text-info"
          );
        } else if (type === "product_start") {
          logLine(`[${data.index}/${data.total}] 采集 SPU=${data.spu} ${data.name || ""}`);
        } else if (type === "product_done") {
          priced[data.spu] = {
            status: data.status,
            purchase_price: data.purchase_price,
            shipping: data.shipping,
          };
          const pct = Math.round((data.index / data.total) * 100);
          $("progressBar").style.width = pct + "%";
          $("progressLabel").textContent = `${data.index} / ${data.total}`;
          if (data.status === "ok") {
            logLine(
              `✅ SPU=${data.spu} 采购价￥${data.purchase_price} 运费￥${data.shipping} 重量${data.weight_g}g [${data.via}]`,
              "text-success"
            );
          } else if (data.status === "base") {
            logLine(`⬜ SPU=${data.spu} 基础行已写入（采购价/重量待人工填）`, "text-info");
          } else if (data.status === "empty") {
            logLine(`⬜ SPU=${data.spu} 无同款 → 留空待人工补`, "text-warning");
          } else {
            logLine(`⚠️ SPU=${data.spu} 未入库（${data.note || "失败"}）`, "text-danger");
          }
          renderTable();
        } else if (type === "batch_done") {
          logLine(`批次完成：成功 ${data.ok}，失败/存疑 ${data.fail}`, "text-info");
        } else if (type === "aborted") {
          logLine(`❌ 中止：${data.reason}`, "text-danger");
          showToast("采集中止", data.reason, "danger");
        }
      }

      function finishRun() {
        if (evtSource) {
          evtSource.close();
          evtSource = null;
        }
        $("startSpinner").classList.add("d-none");
        $("statusText").textContent = "";
        loadWorklist(); // 刷新入库统计（本批结果落库后重新读 Excel）+ 复位开始按钮禁用态
      }

      async function startBatch() {
        if (!sel.sheet) {
          showToast("无法开始", "请先选择目标 Sheet", "warning");
          return;
        }
        const limit = parseInt($("inputLimit").value, 10);
        if (!Number.isInteger(limit) || limit < 1) {
          showToast("无法开始", "当前没有可采 SKU，或数量不是有效正整数", "warning");
          return;
        }
        const auto1688 = $("switchAuto1688").checked;
        const usePipeline = $("switchPipeline").checked;
        $("btnStart").disabled = true;
        $("startSpinner").classList.remove("d-none");
        $("statusText").textContent = "采集中…";
        priced = {};
        try {
          const r = await fetch("/collect/batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              limit,
              base_only: !auto1688,
              use_pipeline: usePipeline,
              excel: sel.excel,
              sheet: sel.sheet,
              store: sel.store,
              doc_mode: docMode(),
              append_mode: sel.append_mode,
              // 空串要送 null：后端 append_row 是 Optional[int]，空串会 422
              append_row: sel.append_row === "" ? null : Number(sel.append_row),
            }),
          });
          const { job_id } = await r.json();
          evtSource = new EventSource(`/collect/batch/${job_id}/events`);
          ["batch_start", "product_start", "product_done", "batch_done", "aborted"].forEach(
            (ev) =>
              evtSource.addEventListener(ev, (e) => onEvent(ev, JSON.parse(e.data)))
          );
          evtSource.addEventListener("done", () => finishRun());
          evtSource.onerror = () => {
            // 流结束或断开：done 事件后浏览器会触发一次 error，忽略即可
            if (evtSource && evtSource.readyState === EventSource.CLOSED) finishRun();
          };
        } catch (e) {
          showToast("启动失败", String(e), "danger");
          finishRun();
        }
      }

      async function refreshWorklist() {
        $("btnRefresh").disabled = true;
        $("statusText").textContent = "重新枚举中…";
        try {
          const r = await fetch("/collect/enumerate", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ status: sel.status, region: sel.region }),
          });
          const data = await r.json();
          // 409 = 区域问题（没开列表页 / 目标区域不存在 / 切过去后复核失败）。这是要去
          // 浏览器里处理的事，reason 已经是可操作文案，原样展示，别裹成「枚举失败」
          if (r.status === 409) {
            showToast("区域未就绪", data.reason || "区域未确认", "warning");
            return;
          }
          const scope = sel.status ? `切到「${sel.status}」` : "跟随页面当前";
          const rg = sel.region ? `区域「${sel.region}」，` : "";
          showToast("枚举完成", `${rg}${scope}，共 ${data.count} 个商品`, "success");
          await loadWorklist({ syncCollectLimit: true });
        } catch (e) {
          showToast("枚举失败", String(e), "danger");
        } finally {
          $("btnRefresh").disabled = false;
          $("statusText").textContent = "";
        }
      }

      // 1688 自动采价开关：关（默认）= 基础采集，隐藏「确定性管道」子选项；开才显示
      $("switchAuto1688").addEventListener("change", (e) => {
        $("pipelineWrap").classList.toggle("d-none", !e.target.checked);
      });

      $("btnStart").addEventListener("click", startBatch);
      $("btnRefresh").addEventListener("click", refreshWorklist);
      ["fltTodo", "fltDone", "fltAll"].forEach((id) =>
        $(id).addEventListener("change", renderTable)
      );

      // 工作簿切换：input+datalist，输入本地路径或粘贴协作文档链接后失焦/回车生效；
      // 换工作簿时清空 Sheet（新文档里旧 Sheet 未必存在）后重拉
      $("inputExcel").addEventListener("change", (e) => {
        const v = e.target.value.trim();
        if (v === sel.excel) return;
        sel.excel = v;
        sel.sheet = "";
        loadWorklist();
      });
      $("selSheet").addEventListener("change", (e) => {
        sel.sheet = e.target.value;
        loadWorklist(); // 重算该 Sheet 下的 done/todo
      });
      // 落点只影响写入位置，不影响 done/todo，故不必重新拉清单（省一次请求）
      $("selAppend").addEventListener("change", (e) => {
        sel.append_mode = e.target.value;
        syncAppendUI();
      });
      $("inputAppendRow").addEventListener("input", (e) => {
        sel.append_row = e.target.value.trim();
        syncAppendUI();
      });
      // 切本地/线上：目标表整个换了，excel 清空交给后端按该模式重新解析（本地模式会自动
      // 挑桌面候选），Sheet 一并清掉——新文档里旧 Sheet 未必存在
      ["docModeLocal", "docModeCloud"].forEach((id) => {
        $(id).addEventListener("change", (e) => {
          if (!e.target.checked) return;
          sel.excel = "";
          sel.sheet = "";
          loadWorklist();
        });
      });
      $("selStore").addEventListener("change", (e) => {
        sel.store = e.target.value;
        loadWorklist(); // 过滤到该店
      });
      // 采集页签只在「重新枚举」时生效，改选不重拉清单，仅记住选择
      $("selStatus").addEventListener("change", (e) => {
        sel.status = e.target.value;
      });
      // 区域同理：只在「重新枚举」时生效（切区域是整页跳转，不该在改下拉时就触发）
      $("selRegion").addEventListener("change", (e) => {
        sel.region = e.target.value;
      });

      // ---- 协作文档链接登记簿：候选回填 + 手动命名 --------------------------
      // 登记过的链接（含名字）合并进工作簿 datalist；「收藏」按钮给当前链接起名
      // 登记。正常跑批时服务端 save_prefs 也会自动登记，这里主要是补名字。
      let cloudDocs = [];
      let lastStatus = null;
      async function loadCloudDocs() {
        try {
          const r = await fetch("/api/cloud_docs");
          cloudDocs = (await r.json()).docs || [];
        } catch (e) {
          cloudDocs = [];
        }
      }
      $("btnSaveCloudDoc").addEventListener("click", async () => {
        const url = $("inputExcel").value.trim();
        if (!/^https?:\/\//i.test(url)) {
          showToast(
            "不是协作文档链接",
            "先在工作簿输入框粘贴 https://www.kdocs.cn/l/... 链接，再点登记",
            "warning"
          );
          return;
        }
        const existing = cloudDocs.find((d) => d.url === url);
        const name = prompt(
          "给这个链接起个名字（留空＝只登记链接）：",
          existing ? existing.name : ""
        );
        if (name === null) return; // 取消
        try {
          await fetch("/api/cloud_docs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, name: name.trim() }),
          });
          await loadCloudDocs();
          if (lastStatus) fillSelectors(lastStatus); // 重渲 datalist 候选
          showToast("已登记", name.trim() ? `${name.trim()}：${url}` : url, "success");
        } catch (e) {
          showToast("登记失败", String(e), "danger");
        }
      });

      loadCloudDocs().then(() => loadWorklist());
    </script>
  </body>
</html>
