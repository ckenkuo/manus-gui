# Global LLM configuration
[llm]
model = "claude-3-7-sonnet-20250219"       # The LLM model to use
base_url = "https://api.anthropic.com/v1/" # API endpoint URL
api_key = "YOUR_API_KEY"                   # Your API key
max_tokens = 8192                          # Maximum number of tokens in the response
temperature = 0.0                          # Controls randomness

# [llm] # Amazon Bedrock
# api_type = "aws"                                       # Required
# model = "us.anthropic.claude-3-7-sonnet-20250219-v1:0" # Bedrock supported modelID
# base_url = "bedrock-runtime.us-west-2.amazonaws.com"   # Not used now
# max_tokens = 8192
# temperature = 1.0
# api_key = "bear"                                       # Required but not used for Bedrock

# [llm] #AZURE OPENAI:
# api_type= 'azure'
# model = "YOUR_MODEL_NAME" #"gpt-4o-mini"
# base_url = "{YOUR_AZURE_ENDPOINT.rstrip('/')}/openai/deployments/{AZURE_DEPLOYMENT_ID}"
# api_key = "AZURE API KEY"
# max_tokens = 8096
# temperature = 0.0
# api_version="AZURE API VERSION" #"2024-08-01-preview"

# [llm] #OLLAMA:
# api_type = 'ollama'
# model = "llama3.2"
# base_url = "http://localhost:11434/v1"
# api_key = "ollama"
# max_tokens = 4096
# temperature = 0.0

# [llm] #Jiekou.AI:
# api_type = 'jiekou'
# model = "claude-sonnet-4-5-20250929"                               # The LLM model to use
# base_url = "https://api.jiekou.ai/openai"                          # API endpoint URL
# api_key = "your Jiekou.AI api key"                                 # Your API key
# max_tokens = 64000                                                 # Maximum number of tokens in the response
# temperature = 0.0                                                  # Controls randomness

# Optional configuration for specific LLM models
[llm.vision]
model = "claude-3-7-sonnet-20250219"       # The vision model to use
base_url = "https://api.anthropic.com/v1/" # API endpoint URL for vision model
api_key = "YOUR_API_KEY"                   # Your API key for vision model
max_tokens = 8192                          # Maximum number of tokens in the response
temperature = 0.0                          # Controls randomness for vision model

# [llm.vision] #OLLAMA VISION:
# api_type = 'ollama'
# model = "llama3.2-vision"
# base_url = "http://localhost:11434/v1"
# api_key = "ollama"
# max_tokens = 4096
# temperature = 0.0

# Optional GUI vision model — used as a fallback when browser_use DOM element
# recognition fails (no interactive elements, custom date/map/canvas widgets).
# The browser tool's action="gui_action" screenshots the page and asks this
# model for a pixel-coordinate atomic action. Falls back to [llm.vision] if this
# section is omitted; api_key is read from this file only (the DASHSCOPE_API_KEY
# env fallback was removed on 2026-08-20 — two sources for one key meant the env
# var could silently shadow the config value, which is invisible when debugging).
# The model is expected to return absolute pixel coordinates relative to the
# screenshot image; the browser tool scales them to viewport CSS pixels.
# [llm.gui]
# api_type = 'openai'
# model = "qwen3.7-plus"                                          # DashScope vision model
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# api_key = "YOUR_DASHSCOPE_API_KEY"
# max_tokens = 2048
# temperature = 0.0

# 白底主体提取（批量采集：图搜查询图预处理）——app/collect/image_extract.py
# Temu 主图常是营销拼图，直接以图搜 recall 差。启用后先用生图模型（packyapi 的
# gpt-image-2 /images/edits）把主图重绘成「纯白背景 + 单一商品」的干净图当【搜索
# 查询图】，配合商品标题约束保留哪一件；判同款仍用原图（生成误差只影响 recall 不影响
# 精度）。
# 【2026-08-20 起改为读本文件，不再走环境变量】原先走 PACKY_* 环境变量是为了避开
# config.py 把空 key 回退成 DASHSCOPE 的老逻辑；那个回退已删除，于是没必要再让
# 密钥散在两处——两处维护时环境变量优先级更高会静默盖掉配置值，排查看不出来。
# 独立成段而不塞进 [llm.*]：那是 DashScope/Anthropic 链路，且段间合并会把 [llm]
# 的 key 补给缺 key 的段，塞进去会拿错 key。
[collect_image]
# 主 key，packyapi 的 Bearer token。留空则跳过白底提取、退回原图搜索，不阻断采集
api_key = ""
# 备用 key（更贵但稳定）：主 key 余额耗尽（"没有可用token"）或调用失败时自动切过去
api_key_expensive = ""
# 以下选填，留空用代码里的默认值
base_url = "https://www.packyapi.com/v1"
model = "gpt-image-2"
size = "1024x1024"
# medium 对搜索查询图够用；这是成本杠杆，别默认 high
quality = "medium"

# Optional configuration for specific browser configuration
# [browser]
# Whether to run browser in headless mode (default: false)
#headless = false
# Viewport size in CSS pixels. Leave unset to use browser_use default 1280x1100.
# Set these to match your real screen's usable area (e.g. 1920x953) so the DOM's
# in-viewport visibility check stays consistent with the screenshot the GUI vision
# model sees — a mismatch makes the model click on elements that are off-screen.
#window_width = 1920
#window_height = 953
# Disable browser security features (default: true)
#disable_security = true
# Extra arguments to pass to the browser
#extra_chromium_args = []
# Path to a Chrome instance to use to connect to your normal browser
# e.g. '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
#chrome_instance_path = ""
# Connect to a browser instance via WebSocket
#wss_url = ""
# Connect to a browser instance via CDP
#cdp_url = ""

# Optional configuration, Proxy settings for the browser
# [browser.proxy]
# server = "http://proxy-server:port"
# username = "proxy-username"
# password = "proxy-password"

# Optional configuration, Search settings.
# [search]
# Search engine for agent to use. Default is "Google", can be set to "Baidu" or "DuckDuckGo" or "Bing".
#engine = "Google"
# Fallback engine order. Default is ["DuckDuckGo", "Baidu", "Bing"] - will try in this order after primary engine fails.
#fallback_engines = ["DuckDuckGo", "Baidu", "Bing"]
# Seconds to wait before retrying all engines again when they all fail due to rate limits. Default is 60.
#retry_delay = 60
# Maximum number of times to retry all engines when all fail. Default is 3.
#max_retries = 3
# Language code for search results. Options: "en" (English), "zh" (Chinese), etc.
#lang = "en"
# Country code for search results. Options: "us" (United States), "cn" (China), etc.
#country = "us"


## Sandbox configuration
#[sandbox]
#use_sandbox = false
#image = "python:3.12-slim"
#work_dir = "/workspace"
#memory_limit = "1g"  # 512m
#cpu_limit = 2.0
#timeout = 300
#network_enabled = true

# MCP (Model Context Protocol) configuration
[mcp]
server_reference = "app.mcp.server" # default server module reference

# Optional Runflow configuration
# Your can add additional agents into run-flow workflow to solve different-type tasks.
[runflow]
use_data_analysis_agent = false     # The Data Analysi Agent to solve various data analysis tasks

# Optional RAG experience library — distill successful task flows and retrieve the
# most similar ones (hybrid dense + BM25 + RRF) to inject as few-shot on new runs,
# so the agent takes fewer detours. Write entry: interactive [y/N] confirm after a
# successful run; non-interactive runs (e.g. --prompt scripts) skip saving.
# To edit/delete an entry, hand-edit experience/recipes.jsonl (human-readable).
# Requires: pip install faiss-cpu rank-bm25 jieba
# [experience]
# enabled = true
# embedding_model = "text-embedding-v4"  # embedding model; build & query must match
# top_k = 2                              # how many similar recipes to inject
# min_score = 0.35                       # relevance floor gate
# rrf_k = 60                             # reciprocal rank fusion constant

# 活动管理管线（Temu 关流量加速器 → 报活动 → 开加速器）默认参数。
# 毛利率红线三级回退：此处全局默认 → 本批运行值(web/CLI) → SPU清单逐品覆盖(spu:margin)。
[activity]
# 最低毛利率红线：申报价须保证 (申报价-成本)/申报价 >= 此值，否则跳过不报（skip_redline）。
min_margin = 0.15
# 申报价策略：'discount_ceiling'=贴活动折扣上限取最高价（守利润同时少让利）。
price_strategy = "discount_ceiling"

# 商品采集管线（Temu 商品 → 1688 比价 → 成本核算表）的云端协作表格（金山文档）。
# 填了 cloud_file_id 后，采集默认写入云端而非本地 xlsx；UI/CLI 显式粘贴的链接优先于此。
# 注意这只是【默认值】：页面上的「本地文档 / 线上文档」开关（或 CLI 的 --doc-mode local）
# 会压制它——kdocs 有配额，用满了要能不改配置就切回本地表继续干活。
[collect]
cloud_file_id = ""
cloud_link = ""   # 人类可读的分享链接，仅用于 UI 回显

# 新行写入位置（UI 的「写入位置」下拉同源，这里只是出厂默认；用户在页面选过就以 prefs 为准）：
#   bottom    追加到数据区末尾（默认）
#   top       插到表头正下方，已有数据下移
#   row_down  从 append_row 行开始向下插（原该行及以下下移）
#   row_up    插在 append_row 行之前（该行内容不变、行号变大）
# append_row 仅 row_down / row_up 用；缺失或落在表头及以上时自动退回 bottom 并告警。
append_mode = "bottom"
append_row = 0

# 订单登记管线（Temu 待发货订单 → 本地订单登记表）。
# 走页面自带「导出订单」拿官方 xlsx，产品主图从 DOM 抓（导出文件里没有图）。
[orders]
# 订单登记表绝对路径（换成本机实际路径；下面的店铺/Sheet 映射同样是占位示例，
# 必须按自己登记表的真实 Sheet 名和店铺名改写，照抄会写错表）。
workbook = "C:\\Users\\<用户名>\\Desktop\\订单登记表.xlsx"
# 协作文档模式（可选）：cloud_file_id 非空时，订单登记的水位/判重/写入全部打在金山
# 协作表格上（本地 workbook 不再参与；采购汇总仍落本地）。file_id 用 kdocs-cli 上传
# 本地表后获得。留空则走本地 xlsx 路径。
# 同上，这只是【默认值】：页面的「本地文档 / 线上文档」开关（或 --doc-mode local）会压制
# 它。切本地时若上面的 workbook 也没配（或文件已改名失效），页面会让你从桌面候选里自己
# 选一张表——登记表选错就是写进别人家的表，代码不替你猜。
cloud_file_id = ""
cloud_link = ""
# 待发货订单页 URL（含筛选参数；管线不切店铺，用当前 CDP 里已登录的那个店）。
list_url = "https://agentseller.temu.com/mmsos/orders.html?fulfillmentMode=0&queryType=2&sortType=1&timeZone=UTC%2B8&needBuySignService=0&sellerNoteLabelList=&packageAbnormalTypeList="
# 判重键。一个订单可含多个子订单（多行），所以【绝不能只配 ["订单号"]】——那会把同订单的
# 其余子订单全当重复丢掉，直接少买（管线检测到单列键会告警，并按表内实际列自动补一位）。
# 默认「订单号 + 尺码」：尺码取自导出的「商品属性」。注意它不保证唯一——实测有的 SKU 属性
# 恒为 `Variant`（Temu 那边就没规格名），同一订单里两个该商品的子订单会撞成同一个键、
# 第二行被丢掉，此时汇总里的 collided_skipped 会报出来。
# 更精确的做法是在登记表加一列「子订单号」（一单一号，不会撞），管线会自动优先用它，
# 也可以在这里显式写成 ["订单号", "子订单号"]。
dedupe_by = ["订单号", "尺码"]

# 店铺/站点 → 目标 Sheet 映射。未命中的订单跳过并在进度里报告，绝不臆测落点
# （例：StoreA牛仔裤 虽是 StoreA 的美国单，但列结构是牛仔裤专用，不能当 StoreA 美国站的落点）。
# store      = 页面右上角的登录店铺名
# sites      = 归一化后的站点（导出的「哥伦比亚站」会先去掉尾字「站」）
# sheet      = 目标工作表名
# store_value= 写进「订单店铺」列的值，照抄表内既有写法（可能 ≠ 登录店铺名）
#
# 下列映射由 2026-07-27 对登记表的只读探测反推：按【出现频次】统计各 Sheet 已登记行的
# 「订单店铺 / 站点区分」取值（去重集合分不清真值与脏数据——表里混着被贴进这两列的尺码
# 和 DISPIMG 公式，各只有 1 行；真值动辄几十上百行）。只配了「表里数据能唯一确定落点」
# 的组合，其余留空等人工确认，宁可报未映射也不猜。
[[orders.sheet_map]]
store = "StoreA"
sites = ["哥伦比亚", "秘鲁"]
sheet = "StoreA全球1"
store_value = "StoreA全球"

# StoreB 主表：哥伦比亚/秘鲁两站混写在同一张表，店铺列多数行写「StoreB」。
[[orders.sheet_map]]
store = "StoreB"
sites = ["哥伦比亚", "秘鲁"]
sheet = "StoreB"
store_value = "StoreB"

# StoreB 欧区单独一张表：德国/西班牙/意大利/法国/波兰/匈牙利（店铺列历史上多为空，
# 仍写 StoreB 以便判重口径一致——判重键是订单号+尺码，不含店铺列）。
[[orders.sheet_map]]
store = "StoreB"
sites = ["德国", "西班牙", "意大利", "法国", "波兰", "匈牙利"]
sheet = "StoreB欧区"
store_value = "StoreB"

# StoreC 按站点分两张表：美国单独一张，哥伦比亚/秘鲁进「全球」。
[[orders.sheet_map]]
store = "StoreC"
sites = ["美国"]
sheet = "StoreC美国"
store_value = "StoreC"

[[orders.sheet_map]]
store = "StoreC"
sites = ["哥伦比亚", "秘鲁"]
sheet = "StoreC全球"
store_value = "StoreC"

# 采购汇总上传到 NAS（可选）：配了 webdav_url 才启用，留空则完全不上传。
#
# TNAS 侧开启：控制面板 → 文件服务 → WebDAV。端口在那里自定，2026-08-10 实测
# 本机是 HTTP=8800 / HTTPS=474（TOS 允许改，别照抄别处文档写的默认 5005/5006）。
#
# HTTP vs HTTPS 的安全取舍：
#   - HTTP + Basic Auth = 账号密码 base64 后放在请求头里，base64 不是加密，等于明文，
#     路由上的每一跳都能读。只能内网测试用，绝不要暴露到公网。
#   - HTTPS 才能安全穿公网。外网访问需要 DDNS 域名或反向代理指到 HTTPS 端口。
#   - SMB(445) 无论如何都不要开到公网（会被扫描器和勒索软件盯上）。
#
# 关于自签证书（2026-08-10 实测本机 NAS）：
#   TOS 出厂带的是 TerraMaster 自签证书（CN=webdav，自己签自己，2040 到期），
#   requests 默认 verify=True 会直接 SSLError 握手失败，所以自签证书下必须
#   verify_ssl = false。代价是失去中间人防护——公网长期用的话，更好的做法是在
#   TOS 里给 NAS 配一张正规证书（支持 Let's Encrypt），配好后把 verify_ssl 改回 true。
#
# 内网 IP vs 公网域名：
#   - 内网（https://192.168.x.x:474/manus）：只在家里网络可用，速度快
#   - 公网（https://你的域名:474/manus）：外网可用，需 DDNS 或反向代理
#   端口 474 是实测值，TOS 可自定义，用你实际配置的那个。
#
# 人看文件仍可继续用 TNAS.online 的网页端，与本上传互不影响。
[orders.upload]
# WebDAV 根地址，指到要存放的共享。留空 = 关闭上传功能。
# 公网示例: https://你的域名:474/manus
# 内网示例: https://192.168.10.252:474/manus
webdav_url = ""
username = ""
# 密码建议不写在这里，改设环境变量 TNAS_WEBDAV_PASSWORD（本仓库是 public，
# 虽然 config.toml 已 gitignored，少一处明文就少一次误提交的机会）
password = ""
# 自签证书必须设 false，否则 requests 直接 SSLError（见上方实测说明）。
# HTTP 连接忽略此项。
verify_ssl = true

# 发布管线的文本判断模型（app/publish/）—— 类目选择、属性比对、标题生成、
# 尺码表估算、SKU 货号翻译、包装清单判断这 6 个单发判断点都走它。
# 已从 deepseek-v4-flash 迁移到 packycode 的 grok-4.6（更快、上下文窗口更大）。
# 【max_tokens 必须给足】grok-4.6 同样是推理模型，先产 reasoning_content 再产
# content。给小了推理就把额度占满、content 返回空字符串，且 finish_reason=length，
# 表现为「调用成功但结果为空」——排查时极易误以为是提示词问题。
# 原 deepseek 实测用量（属性审核这个最重的判断点：33 属性行 / 18 项带 options /
# 289 个选项条目，prompt 3615 token）需要 max_tokens=16000 才不截断。
# grok-4.6 上下文窗口 500k，保守沿用 16000；实测若够用可适当下调。
[llm.publish]
api_type = "openai"
model = "grok-4.6"
base_url = "https://cf.api.fan/v1"
api_key = ""                                                   # 你的 packycode API key
max_tokens = 16000
temperature = 0.0
api_version = ""

# ---- 发布管线的备选模型（发布页下拉可切换）------------------------------------
# 每段对应 app/publish/llm.py 的 LLM_CHOICES 一项；api_key 留空的段在下拉里显示为
# 不可用（判据是本文件该段的 api_key 是否填了，见 _section_api_key 的注释）。
# 切模型不需要改代码，但【换端点前先验一发它收不收图】：各家对图片的接受方式不同。

# Kimi Code（api.kimi.com/coding/v1）。
# 【temperature 必须是 1】这批模型只接受 1，给 0.0 直接 400
# 「invalid temperature: only 1 is allowed for this model」（2026-08-21 实测）。
# 【只接受 base64 图片】远程 http 图片 URL 一律 400 unsupported image url
# （2026-08-22 实测）；发布管线已统一在 image_ref 里下载转 base64，故可用。
[llm.publish-kimi]
api_type = "openai"
model = "k3"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""                                                   # 你的 Kimi Code API key
max_tokens = 16000
temperature = 1.0
api_version = ""

[llm.publish-kimi-k27]
api_type = "openai"
model = "kimi-for-coding"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""
max_tokens = 16000
temperature = 1.0  # 只能 1，同上
api_version = ""

[llm.publish-kimi-k256k]
api_type = "openai"
model = "k3-256k"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""
max_tokens = 16000
temperature = 1.0  # 只能 1，同上
api_version = ""

[llm.publish-kimi-highspeed]
api_type = "openai"
model = "kimi-for-coding-highspeed"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""
max_tokens = 16000
temperature = 1.0  # 只能 1，同上
api_version = ""

# DeepSeek 官方视觉模型（api-docs.deepseek.com/zh-cn/guides/vision）。
# 走官方 chat/completions 协议，content 是 text + image_url 两段，与项目既有拼装一致。
# base64 与远程 http URL 都收（2026-08-22 实测，两种都返回 200），但发布管线
# 一律走 base64（image_ref 已统一下载
# 转码）：远程 URL 是让服务端自己出网取图，成不成看它的出网环境，不可控。
# 【max_tokens 给到 32000】2026-08-22 属性审核实测：32 行属性 + 各行 options 的提示词
# 下一次推理要 11165 completion token，16000 额度会偶发撞 finish_reason="length"——
# 推理链吃满额度、content 返回空，靠重试才成功，白等 2 分 17 秒。端点上限探到 65536
# 可用，故留一倍余量。按量计费只算实际产出的 token，调高额度本身不涨钱。
[llm.publish-deepseek]
api_type = "openai"
model = "deepseek-v4-flash-vision-exp"
base_url = "https://api.deepseek.com"
api_key = ""                                                   # 你的 DeepSeek API key
max_tokens = 32000
temperature = 0.0
api_version = ""

# ---- 店小秘 Temu 半托管发布管线（app/publish/）--------------------------------
# 从 1688 链接到店小秘草稿保存的 12 阶段发布流程。浏览器操作走 [browser].cdp_url
# 接管已登录的真实 Chrome，与采集/订单/活动三条管线同一个前提。

# 同一个 deepseek-v4-flash-vision-exp，走 Packy（cf.api.fan）网关而不是官方端点。
# 【为什么两条都留】官方段与本段模型名相同、能力相同，差别只在计费与出网链路：
# 官方按量计费、要单独充值；Packy 走已有订阅额度。2026-08-25 grok-4.6 整段被
# Packy 网关限流打死（每发都 503 packy_api_error「达到可承受的 QPS/TPM 高峰」，
# 文本与视觉 0 成功），而同一网关同一 key 下的本段全绿——故这是 grok 档挂掉时
# 不必换供应商就能顶上的那一档。
# 2026-08-25 实测（本 key + cf.api.fan）：
#   chat/completions 文本 1.19s 通；responses 协议 1.03s 也通（取 chat，与官方段
#     协议一致，image_url 拼装可直接复用，不必像 grok 那样开 openai-response）；
#   base64 图像理解 8.28s 通（商品图答「白色、浅蓝色」，与图相符）；
#   temperature = 0.0 被接受（不像 Kimi 只收 1）。
# 【max_tokens 沿用 32000】同一个推理模型，截断返空的坑与官方段完全一样——
# 给 16000 会偶发 finish_reason="length"、content 返空，靠重试白等两分钟。
[llm.publish-packy-deepseek]
api_type = "openai"
model = "deepseek-v4-flash-vision-exp"
base_url = "https://cf.api.fan/v1"
api_key = ""                                                   # 你的 packycode API key
max_tokens = 32000
temperature = 0.0
api_version = ""

[publish]
# 图片 AI 编辑（去中文/去水印/描述图英化）用的 Packy gpt-image-2 密钥。
# 【与 [llm.publish].api_key 是两个不同分组的 key，不能混用】2026-08-20 实测：
# 生图 key 所在分组只有 gpt-image-2，[llm.publish] 那个分组只有 grok-4.5/4.6。
# 拿 grok 的 key 调 gpt-image-2 会得 503「分组下模型无可用渠道」，反之同理。
# 与 [collect_image].api_key 通常可填同一个（都是 gpt-image-2）。
# 留空则纯本地几何合规化仍可用（fit34 / square / compress 不需要密钥），
# 只有 AI 编辑会报错提示来配。
packy_api_key = ""
# 店小秘账号级常量：图片直传图床时回调要带的 fullCid。抓包 /api/cos/cosDxmCallBack.json
# 的 fullCid 参数可得（形如 "5153348-"）。换账号必须改，否则图片传上去登记不到自己名下。
full_cid = ""
# 申报价（元）与库存的批量默认值，可在调用时覆盖
declare_price = "168"
stock = "100"
# 仓库名（阶段⑪ 变种信息页勾选，只勾这一个）。站点映射未命中时的默认仓库。
warehouse = "飞特COL仓库"

# 站点 → 仓库 映射（阶段⑪「选择仓库」按站点勾选哪一个）。站点名与 --site 一致（如 美国），
# 未列出的站点回退到上面的 warehouse。选项集合因站点而异、不能写死（bulkattr 实测）：
#   美国站  「嘉运美东仓」
#   哥伦比亚站 「飞特COL仓库 / 哥伦比亚-新势力」
#   秘鲁站  「飞特PE仓库」
[publish.warehouse_by_site]
"美国" = "嘉运美东仓"
"哥伦比亚" = "飞特COL仓库"
"秘鲁" = "飞特PE仓库"

# ---- 发布流程中断告警（app/publish/alert.py）------------------------------------
# 发布是长流程作业（单商品 19 阶段、批次动辄几小时），人不守着页面，中断要主动推。
# 只发三类：批次中止（CDP 掉线等）、单商品失败、批次收尾有失败；阶段内的 manual_check
# 刻意不发（数量多、大多不阻断，会把群刷成日志流）。
# webhook 取法：飞书群 → 设置 → 群机器人 → 添加「自定义机器人」，复制它的 webhook 地址。
# 是凭证，别提交进版本库（真实值只写进 gitignored 的 config.toml）；
# 临时切群可用环境变量 PUBLISH_ALERT_WEBHOOK 覆盖。留空即整个告警静默跳过。
# 自检：python publish_run.py --test-alert
[publish.alert]
enabled = true
webhook = ""

# 管线错误集中上报到公网 MySQL（app/error_report.py，切面 + 注解式）。
# 多台 PC 同时跑采集/订单/活动/发布四条管线时，把「主流程失败」（商品失败/批次
# 中止/批次异常退出）结构化写进同一张表，方便按 pipeline/stage/item/machine 聚合
# 排查、针对性改代码。best-effort：未启用或写库失败只告警、绝不中断主流程。
# enabled 默认 false，需显式置 true 且 host/database 非空才启用。
# 真实值只写进 gitignored 的 config.toml；公网直连建议 MySQL 开 SSL / IP 白名单 /
# SSH 隧道，并用独立只写账号（仅 INSERT + 建表权限），勿用 root。
[error_report]
enabled = false
host = ""
port = 3306
user = ""
password = ""
database = ""
# 表名由代码自动 CREATE TABLE IF NOT EXISTS；只允许字母数字下划线
table = "pipeline_errors"
# 可选：同一台机器跑多实例/多账号时用于区分（留空则只用 hostname 区分机器）
instance = ""
