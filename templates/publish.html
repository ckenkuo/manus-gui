<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品发布 · 店小秘 Temu 半托管</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <link href="/static/bootstrap.min.css" rel="stylesheet" />
    <link
      href="https://gcore.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: var(--bs-body-bg);
      }
      /* 进度日志：等宽、可滚动，实时 append */
      #eventLog {
        height: 240px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        background: var(--bs-tertiary-bg);
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
      }
      #eventLog .line {
        white-space: pre-wrap;
        word-break: break-all;
      }
      /* 缓存面板折叠头：整行可点，箭头随 aria-expanded 旋转（收起指右、展开指下）。
         只让标题这一段当触发器，右侧刷新/清空按钮才不会顺带把面板折起来 */
      .cache-toggle {
        cursor: pointer;
      }
      .cache-toggle .bi-chevron-down {
        transition: transform 0.15s;
      }
      .cache-toggle[aria-expanded="false"] .bi-chevron-down {
        transform: rotate(-90deg);
      }
      /* 15 阶段迷你状态格 */
      .stage-cell {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 0.25rem;
        background: var(--bs-secondary-bg);
        border: 1px solid var(--bs-border-color);
        margin-right: 2px;
        vertical-align: middle;
      }
      .stage-cell.running {
        background: var(--bs-primary);
        animation: pulse 1s infinite alternate;
      }
      .stage-cell.ok {
        background: var(--bs-success);
      }
      .stage-cell.skipped {
        background: var(--bs-warning);
      }
      .stage-cell.fail {
        background: var(--bs-danger);
      }
      @keyframes pulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 1;
        }
      }
      .product-row td {
        vertical-align: middle;
      }
      .cell-ellipsis {
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #manualList {
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-3">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
          <i class="bi bi-cloud-upload me-1"></i> 商品发布
          <small class="text-muted fs-6">店小秘 Temu 半托管</small>
        </span>
        <div class="ms-auto">
          <a href="/collect" class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-box-seam"></i> 批量采集
          </a>
          <a href="/orders" class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-clipboard-check"></i> 订单登记
          </a>
          <a href="/activity" class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-megaphone"></i> 活动管理
          </a>
          <a href="/" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-chat-dots"></i> 返回对话
          </a>
        </div>
      </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
      <!-- 发布闸门提示：⑮「立即发布」由下方「自动发布」开关控制，默认开。
           文案随开关实时切换（见 syncPublishHint），不写死其中一种状态——原先这里
           写死「不会点发布」，而闸门早已可开，看着就像页面在骗人。 -->
      <div id="publishHint" class="alert alert-warning py-2" role="alert">
        <i class="bi bi-shield-exclamation"></i>
        <span id="publishHintText"></span>
      </div>

      <!-- 任务表单 -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-end mb-2">
            <!-- 店铺列收到 2 列给「自动发布」开关腾位：店铺名（Pawly 之类）比站点名短，
                 且这一列没有 siteHint 那样的附加提示，收窄最不伤可读性。 -->
            <div class="col-6 col-md-2">
              <label class="form-label small text-muted mb-1">
                店铺
                <a
                  href="#"
                  id="lnkReloadStores"
                  class="text-decoration-none ms-1"
                  title="重新读取店小秘账号下的店铺（新授权了店铺时点这里）"
                  ><i class="bi bi-arrow-clockwise"></i></a
                >
              </label>
              <select
                id="selStore"
                class="form-select form-select-sm"
                title="店铺来自店小秘账号（/api/userIn.json），只列 Temu 店；已过期的店会标注"
              >
                <option value="">（读取中…）</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">
                站点
                <a
                  href="#"
                  id="lnkReloadSites"
                  class="text-decoration-none ms-1"
                  title="重新探测该店铺的站点（店铺新开通了站点时点这里）"
                  ><i class="bi bi-arrow-clockwise"></i></a
                >
                <span id="siteHint" class="text-muted"></span>
              </label>
              <select
                id="selSite"
                class="form-select form-select-sm"
                title="站点只能从店小秘认领弹窗里读到（勾中店铺后才渲染），首次探测约 3~5 秒，之后按店铺缓存。店小秘没有「全球」站点，必须选具体国家站点"
              >
                <option value="">（先选店铺）</option>
              </select>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label small text-muted mb-1">模型</label>
              <select
                id="selLlm"
                class="form-select form-select-sm"
                title="发布管线各 LLM 阶段的默认模型；选项在 config/config.toml 的 [llm.publish*] 段配置。可在下方「按阶段指定模型」里单独覆盖某个阶段"
              ></select>
              <a
                href="#"
                id="lnkStageLlm"
                class="small text-decoration-none"
                data-bs-toggle="collapse"
                data-bs-target="#boxStageLlm"
                title="纯文本判断点换非推理模型可省一半以上时间；看图阶段只能选多模态模型"
                >按阶段指定模型<span id="stageLlmCount"></span></a
              >
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label small text-muted mb-1">从阶段续跑</label>
              <select
                id="selFromStage"
                class="form-select form-select-sm"
                title="默认「全新跑」从①开始；选某个阶段则前序阶段按已完成跳过，从该阶段接着跑（用于失败后重跑）"
              ></select>
            </div>
            <!-- 申报价：⑩ 变种表的申报价（人民币），留空按 188.88。
                 建议售价由后端按它 ÷7 折算成美元，两列一起变，不用另填。 -->
            <div class="col-6 col-md-2">
              <label class="form-label small text-muted mb-1">申报价</label>
              <input
                id="inputPrice"
                type="text"
                inputmode="decimal"
                class="form-control form-control-sm"
                placeholder="188.88"
                title="⑩ 变种表申报价（人民币），想按实际卖价申报就填在这里；留空按默认 188.88。建议售价自动按 ÷7 折算成美元"
              />
            </div>
            <!-- 自动发布开关：默认开（用户 2026-08-25 要求）。放在「开始发布」左边
                 而不是折叠区里——它决定流程是否走到不可逆的 ⑮，必须一眼看得见。
                 只占 1 列：标签短、开关窄，栅格合计仍须 = 12（见 test_控件行栅格不超过12列）。 -->
            <div class="col-6 col-md-1">
              <div class="form-check form-check-inline form-switch small mb-1">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="chkDoPublish"
                  checked
                />
                <label
                  class="form-check-label"
                  for="chkDoPublish"
                  title="开：⑭ 保存落库成功后继续点「发布」→「立即发布」，商品直接上架（不可逆，上架后要下架才能改）。关：流程收尾在保存落库，草稿留在店小秘等人工核对"
                  >自动发布</label
                >
              </div>
            </div>
            <div class="col-12 col-md-2 text-md-end">
              <button id="btnStart" class="btn btn-primary btn-sm">
                <span
                  id="startSpinner"
                  class="spinner-border spinner-border-sm d-none"
                  role="status"
                ></span>
                <i class="bi bi-play-fill"></i> 开始发布
              </button>
              <span id="statusText" class="text-muted small ms-2"></span>
            </div>
          </div>
          <!-- 按阶段指定模型：默认折叠。耗时账见 app/publish/llm.py 的 LLM_STAGES 注释——
               属性/标题这类纯文本判断换非推理模型能省一半以上，看图阶段则不能乱换。 -->
          <div class="collapse mb-3" id="boxStageLlm">
            <div class="border rounded p-2 bg-light">
              <div class="small text-muted mb-2">
                留「跟随默认」即用上方选的模型。带
                <i class="bi bi-image"></i> 的阶段要看图，只能选多模态模型。
              </div>
              <div id="stageLlmRows" class="row g-2"></div>
            </div>
          </div>
          <label class="form-label small text-muted mb-1">
            任务（每行一个）：1688 链接，或
            <code>rowid|info_path</code>（采集认领已建行的续跑格式）
          </label>
          <textarea
            id="inputTasks"
            class="form-control form-control-sm font-monospace"
            rows="6"
            placeholder="https://detail.1688.com/offer/123456.html&#10;rowid123|C:\...\product_info.json"
          ></textarea>
        </div>
      </div>

      <!-- 类目/属性缓存：跑批前的准备/维护动作，故紧跟任务表单、排在进度产出之前。
           条目会越攒越多（类目路径十几条、叶子类目一屏放不下），故整卡与内部的
           路径清单都做成可折叠，折叠状态记 localStorage，刷新页面后保持 -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center py-2">
          <span
            class="small cache-toggle"
            role="button"
            data-bs-toggle="collapse"
            data-bs-target="#cacheCollapse"
            aria-expanded="true"
            aria-controls="cacheCollapse"
          >
            <i class="bi bi-chevron-down"></i>
            <i class="bi bi-lightning-charge"></i> 类目/属性缓存
            <span id="cacheSummary" class="text-muted ms-2"></span>
          </span>
          <span>
            <div class="form-check form-check-inline form-switch small mb-0 me-2">
              <input class="form-check-input" type="checkbox" id="chkUseCache" checked />
              <label
                class="form-check-label text-muted"
                for="chkUseCache"
                title="命中缓存时类目约 15s（否则 110s）、属性省掉逐行读选项。新品类首次跑、或怀疑缓存选错类目时关掉它"
                >本次启用</label
              >
            </div>
            <button id="btnCacheRefresh" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button id="btnCacheClear" class="btn btn-outline-danger btn-sm">
              全部清空
            </button>
          </span>
        </div>
        <div id="cacheCollapse" class="collapse show">
          <div class="card-body py-2">
            <div id="cacheEmpty" class="text-muted small">缓存为空，首次跑会边跑边攒。</div>
            <div id="cacheBody" class="small d-none">
              <div class="mb-2">
                <div
                  class="text-muted mb-1 cache-toggle d-inline-block"
                  role="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#cachePathsWrap"
                  aria-expanded="true"
                  aria-controls="cachePathsWrap"
                >
                  <i class="bi bi-chevron-down"></i>
                  已知类目路径（按最近使用）
                  <span id="cachePathsCount" class="badge bg-light text-secondary"></span>
                </div>
                <div id="cachePathsWrap" class="collapse show">
                  <ul id="cachePaths" class="list-unstyled mb-0 font-monospace" style="font-size: 0.78rem"></ul>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0">
                  <thead>
                    <tr class="text-muted">
                      <th>叶子类目</th>
                      <th class="text-end">已缓存行</th>
                      <th>更新时间</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="cacheAttrs"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 进度条 + 事件日志 -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between small text-muted mb-1">
            <span>本批进度</span>
            <span id="progressLabel">0 / 0</span>
          </div>
          <div class="progress mb-3" style="height: 8px">
            <div
              id="progressBar"
              class="progress-bar"
              role="progressbar"
              style="width: 0%"
            ></div>
          </div>
          <div id="eventLog"></div>
        </div>
      </div>

      <!-- 人工检查清单 -->
      <div class="card mb-3 border-warning">
        <div class="card-header bg-warning-subtle">
          <i class="bi bi-exclamation-triangle"></i> 人工检查清单
          <span class="text-muted small">（管线标记的存疑点，落库前逐项核对）</span>
        </div>
        <ul id="manualList" class="list-group list-group-flush">
          <li class="list-group-item text-muted small py-2" id="manualEmpty">
            暂无
          </li>
        </ul>
      </div>

      <!-- 商品阶段进度表 -->
      <div class="card">
        <div class="card-header">
          <i class="bi bi-list-ul"></i> 商品进度
          <span class="text-muted small">
            （每格一个阶段：灰=未跑 蓝=进行中 绿=ok 黄=skipped 红=fail，悬停看详情）
          </span>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-hover mb-0">
            <thead class="sticky-top bg-body">
              <tr>
                <th style="width: 56px">#</th>
                <th>商品</th>
                <th style="width: 330px">阶段（①→⑭）</th>
                <th style="width: 110px">状态</th>
                <th style="width: 90px">耗时</th>
              </tr>
            </thead>
            <tbody id="productBody">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">
                  尚未开始
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <strong class="me-auto" id="toastTitle">提示</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
      </div>
    </div>

    <script src="/static/bootstrap.bundle.min.js"></script>
    <script>
      // 发布页前端：POST /publish/batch 拿 job_id，进度经 SSE 消费 service 的结构化事件。
      const $ = (id) => document.getElementById(id);
      let evtSource = null;
      // products: index(1 起) -> {offer, title, stages: {stage: {status, elapsed_s, note}}, status}
      let products = {};

      // 与 app/publish/service.py 的 STAGES 保持一致（id + 中文名）
      const STAGES = [
        ["extract", "① 采集提炼"],
        ["claim", "② 采集认领"],
        ["auto_cat", "③ 产品类目"],
        ["attrs", "④ 属性审核"],
        ["titles", "⑤ 标题产地"],
        ["clean_images", "⑤b 图片清理"],
        ["material", "⑥ 素材图"],
        ["skc", "⑦ SKC颜色图"],
        ["fix_sizes", "⑧ 尺码勾选"],
        ["sizechart", "⑨ 尺码表"],
        ["variant", "⑩ 变种信息"],
        ["stock", "⑪ 库存SKU"],
        ["shipping", "⑫ 运输信息"],
        ["desc", "⑬ 描述长图"],
        ["save", "⑭ 保存落库"],
      ];
      const STAGE_NAME = Object.fromEntries(STAGES);

      // 「从阶段续跑」下拉：首项空串=全新跑，其后 15 个阶段
      $("selFromStage").innerHTML =
        '<option value="" selected>全新跑（从①开始）</option>' +
        STAGES.map(
          ([id, name]) => `<option value="${id}">从 ${name} 续跑</option>`
        ).join("");

      // 「模型」下拉：选项由后端按 config.toml 的 [llm.publish*] 段给出；
      // 未填 api_key 的选项禁用并标注。切换立即生效（下次 LLM 调用起）。
      async function loadLlmChoices() {
        try {
          const r = await fetch("/publish/llm");
          const data = await r.json();
          const choices = data.choices || [];
          $("selLlm").innerHTML = choices
            .map(
              (c) =>
                `<option value="${c.id}" ${c.active ? "selected" : ""} ` +
                `${c.available ? "" : "disabled"}>` +
                `${esc(c.label)}${c.available ? "" : "（未配 key）"}</option>`
            )
            .join("");
          renderStageLlm(choices, data.stages || []);
        } catch (e) {
          $("selLlm").innerHTML = "<option>（读取失败）</option>";
          $("stageLlmRows").innerHTML =
            '<div class="small text-danger">读取失败</div>';
        }
      }

      // 按阶段的模型下拉：每行一个阶段。看图阶段禁掉非多模态项——那不是慢一点，
      // 是该阶段每次调用直接抛 ValueError（后端 set_stage_choice 也有同一道闸）。
      function renderStageLlm(choices, stages) {
        const n = stages.filter((s) => s.override).length;
        $("stageLlmCount").textContent = n ? `（已覆盖 ${n} 个）` : "";
        $("stageLlmRows").innerHTML = stages
          .map((s) => {
            const opts = [
              `<option value="">跟随默认</option>`,
              ...choices.map((c) => {
                const bad = !c.available || (s.vision && !c.multimodal);
                const why = !c.available
                  ? "（未配 key）"
                  : s.vision && !c.multimodal
                  ? "（不能看图）"
                  : "";
                return (
                  `<option value="${c.id}" ${s.override === c.id ? "selected" : ""} ` +
                  `${bad ? "disabled" : ""}>${esc(c.label)}${why}</option>`
                );
              }),
            ].join("");
            return (
              `<div class="col-12 col-md-6 d-flex align-items-center gap-2">` +
              `<label class="small text-muted text-nowrap" style="min-width:11em">` +
              `${s.vision ? '<i class="bi bi-image"></i> ' : ""}${esc(s.label)}</label>` +
              `<select class="form-select form-select-sm stage-llm" ` +
              `data-stage="${s.id}">${opts}</select></div>`
            );
          })
          .join("");
        // 事件绑在每次重绘出来的 select 上：整块 innerHTML 换掉了，委托到父节点
        // 才不用每次重绑，但这里节点少、重绘不频繁，直接绑更直观。
        document.querySelectorAll(".stage-llm").forEach((sel) => {
          sel.addEventListener("change", async () => {
            const stage = sel.dataset.stage;
            const choice = sel.value;
            try {
              const r = await fetch("/publish/llm/stage", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ stage, choice: choice || null }),
              });
              const data = await r.json();
              if (!r.ok) throw new Error(data.detail || r.status);
              showToast(
                "阶段模型已设置",
                choice ? `${stage} → ${choice}` : `${stage} 跟随默认`,
                "success"
              );
            } catch (e) {
              showToast("设置失败", String(e), "danger");
            }
            loadLlmChoices(); // 同 loadLlmChoices 的闭环：一律以后端状态重绘
          });
        });
      }
      $("selLlm").addEventListener("change", async () => {
        const sel = $("selLlm");
        const choice = sel.value;
        try {
          const r = await fetch("/publish/llm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ choice }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.detail || r.status);
          const active = (data.choices || []).find((c) => c.active);
          showToast("模型已切换", active ? active.label : choice, "success");
        } catch (e) {
          showToast("切换失败", String(e), "danger");
        }
        loadLlmChoices(); // 无论成败都以后端状态为准重绘
      });
      loadLlmChoices();

      // 缓存面板：照 loadLlmChoices 的闭环——任何操作后都重新拉取、以后端状态为准，
      // 不在前端自己维护一份可能与磁盘不一致的镜像。
      async function loadCache() {
        try {
          const r = await fetch("/publish/cache");
          const d = await r.json();
          const nPath = d.paths || 0;
          const nCat = d.attrCategories || 0;
          $("cacheSummary").textContent =
            `类目路径 ${nPath} 条 · 属性类目 ${nCat} 个（${d.attrRows || 0} 行）`;
          const empty = nPath === 0 && nCat === 0;
          $("cacheEmpty").classList.toggle("d-none", !empty);
          $("cacheBody").classList.toggle("d-none", empty);
          if (empty) return;
          $("cachePathsCount").textContent = `${nPath} 条`;
          $("cachePaths").innerHTML = (d.categories || [])
            .map(
              (c) =>
                `<li class="text-truncate" title="${esc((c.path || []).join(" > "))}">` +
                `<span class="badge bg-light text-secondary me-1">${c.hits || 1}次</span>` +
                esc((c.path || []).join(" > ")) +
                `</li>`
            )
            .join("");
          $("cacheAttrs").innerHTML = (d.attrFiles || [])
            .map(
              (f) =>
                `<tr><td class="text-truncate" title="${esc((f.catPath || []).join(" > "))}">` +
                esc(f.leaf || f.slug) +
                (f.site ? ` <span class="text-muted">(${esc(f.site)})</span>` : "") +
                `</td><td class="text-end">${f.rowCount || 0}</td>` +
                `<td class="text-muted">${esc(f.updated_at || "")}</td>` +
                `<td class="text-end"><button class="btn btn-link btn-sm p-0 text-danger" ` +
                `data-slug="${esc(f.slug)}">清除</button></td></tr>`
            )
            .join("");
          $("cacheAttrs")
            .querySelectorAll("button[data-slug]")
            .forEach((b) =>
              b.addEventListener("click", () => clearCache(b.dataset.slug))
            );
        } catch (e) {
          $("cacheSummary").textContent = "读取失败";
        }
      }

      async function clearCache(slug) {
        const what = slug ? `属性缓存「${slug}」` : "全部缓存（含类目路径清单）";
        if (!confirm(`确定清除${what}？清完下一次跑会回落到全量遍历，只是慢，不会出错。`))
          return;
        try {
          const url = "/publish/cache" + (slug ? `?slug=${encodeURIComponent(slug)}` : "");
          const r = await fetch(url, { method: "DELETE" });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || r.status);
          const n = (d.removed && d.removed.attrFiles ? d.removed.attrFiles.length : 0);
          showToast("缓存已清除", `属性类目 ${n} 个`, "success");
        } catch (e) {
          showToast("清除失败", String(e), "danger");
        }
        loadCache(); // 无论成败都以后端状态为准重绘
      }

      $("btnCacheRefresh").addEventListener("click", loadCache);
      $("btnCacheClear").addEventListener("click", () => clearCache(""));
      loadCache();

      // 折叠状态持久化：面板是「跑批前偶尔看一眼」的维护区，攒久了会顶掉下方进度视野，
      // 用户收起后应一直保持收起。这里在 bootstrap 首次接管前直接改 class/aria，
      // 之后只监听它派发的 show/hide 事件回写，避免自己维护第二套开合状态。
      [
        ["cacheCollapse", "publish.cache.open"],
        ["cachePathsWrap", "publish.cache.paths.open"],
      ].forEach(([id, key]) => {
        const panel = $(id);
        const head = document.querySelector(`[data-bs-target="#${id}"]`);
        if (localStorage.getItem(key) === "0") {
          panel.classList.remove("show");
          if (head) head.setAttribute("aria-expanded", "false");
        }
        // collapse 事件会冒泡，内层「类目路径」的开合会一路冒到外层卡片上，
        // 故必须比对 e.target 只认自己那一层，否则两个 key 会互相串写
        panel.addEventListener("show.bs.collapse", (e) => {
          if (e.target === panel) localStorage.setItem(key, "1");
        });
        panel.addEventListener("hide.bs.collapse", (e) => {
          if (e.target === panel) localStorage.setItem(key, "0");
        });
      });

      // 「店铺 / 站点」两个下拉。两者取数路径不对称（店铺一次接口秒出，站点必须
      // 开一次认领弹窗才读得到），细节见 app/publish/shops.py 的模块 docstring。
      // 上次选择记在 localStorage：service 侧的 prefs 也记，但那是给 CLI 续跑用的，
      // 前端要在「下拉刚渲染完」这一刻就把上次的选中回填，读后端 prefs 得多一次
      // 往返、且会与「站点按店铺变化」的联动抢时序。
      const LS_STORE = "publish.store";
      const LS_SITE = "publish.site";
      // 申报价同样记住上次输入：一批商品往往同一个申报口径，每次重填一遍纯属摩擦。
      const LS_PRICE = "publish.price";
      // 自动发布开关也记住选择。【只有显式存过 "0" 才算关】——默认开是产品决定，
      // 不能因为 localStorage 读不到（首次访问/隐私模式）就退成关，那等于默认值随
      // 浏览器状态漂移。
      const LS_PUBLISH = "publish.doPublish";

      async function loadStores() {
        const sel = $("selStore");
        sel.innerHTML = '<option value="">（读取中…）</option>';
        try {
          const r = await fetch("/publish/stores");
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || r.status);
          const stores = d.stores || [];
          if (!stores.length) {
            sel.innerHTML = '<option value="">（账号下没有 Temu 店铺）</option>';
            return;
          }
          const want = localStorage.getItem(LS_STORE) || "";
          sel.innerHTML =
            '<option value="">（请选择店铺）</option>' +
            stores
              .map(
                (s) =>
                  `<option value="${esc(s.name)}" ${
                    s.name === want ? "selected" : ""
                  }>${esc(s.name)}${s.expired ? "（授权已过期）" : ""}</option>`
              )
              .join("");
          // 回填成功才联动加载站点：没选中店铺时站点下拉没有意义，也不该白探一次。
          if (sel.value) loadSites(sel.value);
        } catch (e) {
          sel.innerHTML = '<option value="">（读取失败）</option>';
          showToast("店铺读取失败", String(e).replace(/^Error:\s*/, ""), "danger");
        }
      }

      // refresh=true 时强制重探（忽略磁盘缓存）。探测要开认领弹窗并占用那个 CDP
      // 页面，故按钮期间禁用下拉，避免用户连点触发多次探测互相关掉对方的弹窗。
      async function loadSites(store, refresh = false) {
        const sel = $("selSite");
        const hint = $("siteHint");
        if (!store) {
          sel.innerHTML = '<option value="">（先选店铺）</option>';
          hint.textContent = "";
          return;
        }
        sel.disabled = true;
        sel.innerHTML = `<option value="">（${
          refresh ? "重新探测中，约 3~5 秒…" : "读取中…"
        }）</option>`;
        hint.textContent = "";
        try {
          const url =
            `/publish/sites?store=${encodeURIComponent(store)}` +
            (refresh ? "&refresh=true" : "");
          const r = await fetch(url);
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || r.status);
          const sites = d.sites || [];
          if (!sites.length) {
            sel.innerHTML = '<option value="">（该店铺没有可选站点）</option>';
            return;
          }
          // 选中优先级：上次选的（仍在该店站点里）> 弹窗默认勾选的 > 不预选。
          // 换店铺后上次的站点可能这家店没开通，那就退回弹窗默认，避免选中一个
          // 认领阶段必然报「未找到站点」的值。
          const last = localStorage.getItem(LS_SITE) || "";
          const want = sites.includes(last) ? last : d.default || "";
          sel.innerHTML =
            '<option value="">（请选择站点）</option>' +
            sites
              .map(
                (s) =>
                  `<option value="${esc(s)}" ${
                    s === want ? "selected" : ""
                  }>${esc(s)}</option>`
              )
              .join("");
          hint.textContent = d.cached
            ? `（${sites.length} 个 · 缓存）`
            : `（${sites.length} 个 · 已探测）`;
        } catch (e) {
          sel.innerHTML = '<option value="">（探测失败）</option>';
          showToast("站点探测失败", String(e).replace(/^Error:\s*/, ""), "danger");
        } finally {
          sel.disabled = false;
        }
      }

      $("selStore").addEventListener("change", () => {
        const store = $("selStore").value;
        localStorage.setItem(LS_STORE, store);
        loadSites(store);
      });
      $("selSite").addEventListener("change", () => {
        localStorage.setItem(LS_SITE, $("selSite").value);
      });
      $("lnkReloadStores").addEventListener("click", (e) => {
        e.preventDefault();
        loadStores();
      });
      $("lnkReloadSites").addEventListener("click", (e) => {
        e.preventDefault();
        const store = $("selStore").value;
        if (!store) {
          showToast("无法探测", "请先选择店铺", "warning");
          return;
        }
        loadSites(store, true);
      });
      loadStores();
      $("inputPrice").value = localStorage.getItem(LS_PRICE) || "";

      // 自动发布开关：状态回填 + 顶部提示条随开关切换文案。
      // 提示条两种措辞刻意分色：开＝danger（这一趟会真上架，不可逆），
      // 关＝warning（只落库，还要人工去发）。写死一种会让人看错当前会发生什么。
      function syncPublishHint() {
        const on = $("chkDoPublish").checked;
        const box = $("publishHint");
        box.classList.toggle("alert-danger", on);
        box.classList.toggle("alert-warning", !on);
        $("publishHintText").innerHTML = on
          ? "<b>自动发布已开启</b>：⑭ 保存落库成功后会继续点「发布」→「立即发布」，" +
            "商品直接上架。发布不可逆（上架后要下架才能改），不想自动上架请关掉右侧开关。"
          : "<b>自动发布已关闭</b>：流程收尾在 ⑭ 保存落库，不会点「发布」。" +
            "草稿留在店小秘，请人工核对后再发布。";
      }
      $("chkDoPublish").checked = localStorage.getItem(LS_PUBLISH) !== "0";
      $("chkDoPublish").addEventListener("change", () => {
        localStorage.setItem(LS_PUBLISH, $("chkDoPublish").checked ? "1" : "0");
        syncPublishHint();
      });
      syncPublishHint();

      function esc(s) {
        return String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      }

      function showToast(title, body, kind = "primary") {
        $("toastTitle").textContent = title;
        $("toastBody").textContent = body;
        const el = $("toast");
        el.className = `toast text-bg-${kind}`;
        new bootstrap.Toast(el, { delay: 4000 }).show();
      }

      function logLine(text, cls = "") {
        const box = $("eventLog");
        const div = document.createElement("div");
        div.className = "line " + cls;
        const t = new Date().toLocaleTimeString();
        div.textContent = `[${t}] ${text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      // 解析任务输入：含 | 的行 -> {rowid, info_path}，否则 -> {url}
      function parseTasks(text) {
        return text
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean)
          .map((l) => {
            if (l.includes("|")) {
              const [rowid, ...rest] = l.split("|");
              return { rowid: rowid.trim(), info_path: rest.join("|").trim() };
            }
            return { url: l };
          });
      }

      function stageTooltip(stage, st) {
        let tip = STAGE_NAME[stage] || stage;
        if (!st) return tip + "：未跑";
        tip += `：${st.status}`;
        if (st.elapsed_s != null) tip += `，${st.elapsed_s}s`;
        if (st.note) tip += `，${st.note}`;
        return tip;
      }

      function renderProducts() {
        const body = $("productBody");
        const idxs = Object.keys(products)
          .map(Number)
          .sort((a, b) => a - b);
        if (!idxs.length) {
          body.innerHTML =
            '<tr><td colspan="5" class="text-center text-muted py-4">尚未开始</td></tr>';
          return;
        }
        body.innerHTML = idxs
          .map((i) => {
            const p = products[i];
            const cells = STAGES.map(([stage]) => {
              const st = p.stages[stage];
              const cls = st ? st.status : "";
              return `<span class="stage-cell ${cls}" title="${esc(
                stageTooltip(stage, st)
              )}"></span>`;
            }).join("");
            let badge = '<span class="badge text-bg-info">进行中</span>';
            if (p.status === "ok")
              badge = '<span class="badge text-bg-success">已落库</span>';
            else if (p.status === "fail")
              badge = `<span class="badge text-bg-danger" title="${esc(
                p.note || ""
              )}">失败${
                p.failed_stage
                  ? "@" + esc(STAGE_NAME[p.failed_stage] || p.failed_stage)
                  : ""
              }</span>`;
            return `<tr class="product-row">
              <td class="small text-muted">${i}</td>
              <td class="small cell-ellipsis" title="${esc(p.offer || "")}">${esc(
                p.title || p.offer || ""
              )}</td>
              <td class="text-nowrap">${cells}</td>
              <td>${badge}</td>
              <td class="small">${p.elapsed_s != null ? p.elapsed_s + "s" : ""}</td>
            </tr>`;
          })
          .join("");
      }

      function ensureProduct(index, offer, title) {
        if (!products[index]) {
          products[index] = { offer: offer || "", title: title || "", stages: {}, status: "" };
        }
        if (offer) products[index].offer = offer;
        if (title) products[index].title = title;
        return products[index];
      }

      function addManualCheck(data) {
        $("manualEmpty")?.remove();
        const li = document.createElement("li");
        li.className = "list-group-item list-group-item-warning small py-2";
        li.textContent = `[${data.offer || "?"}] ${
          STAGE_NAME[data.stage] || data.stage
        }：${data.message || ""}`;
        $("manualList").appendChild(li);
      }

      // ---- 事件处理：把 service 的结构化事件映射到 UI ----
      function onEvent(type, data) {
        if (type === "batch_start") {
          $("progressLabel").textContent = `0 / ${data.total}`;
          $("progressBar").style.width = "0%";
          logLine(
            `批次开始：共 ${data.total} 个商品，店铺=${data.store || "(未指定)"}，站点=${data.site}，批号 ${data.batch}`,
            "text-info"
          );
        } else if (type === "product_start") {
          ensureProduct(data.index, data.offer, data.title);
          logLine(`[${data.index}/${data.total}] 开始 ${data.title || data.offer}`);
          renderProducts();
        } else if (type === "stage_start") {
          const p = ensureProduct(data.index, data.offer);
          p.stages[data.stage] = { status: "running" };
          renderProducts();
        } else if (type === "stage_done") {
          const p = ensureProduct(data.index, data.offer);
          p.stages[data.stage] = {
            status: data.status,
            elapsed_s: data.elapsed_s,
            note: data.note,
          };
          if (data.status === "fail") {
            logLine(
              `⚠️ [${data.offer}] ${STAGE_NAME[data.stage] || data.stage} 失败：${data.note || ""}`,
              "text-danger"
            );
          }
          renderProducts();
        } else if (type === "manual_check") {
          addManualCheck(data);
          logLine(
            `🔶 人工检查 [${data.offer}] ${STAGE_NAME[data.stage] || data.stage}：${data.message}`,
            "text-warning"
          );
        } else if (type === "product_done") {
          const p = ensureProduct(data.index, data.offer);
          p.status = data.status;
          p.elapsed_s = data.elapsed_s;
          p.note = data.note;
          p.failed_stage = data.failed_stage;
          const pct = Math.round((data.index / data.total) * 100);
          $("progressBar").style.width = pct + "%";
          $("progressLabel").textContent = `${data.index} / ${data.total}`;
          if (data.status === "ok") {
            logLine(
              `✅ [${data.offer}] 已保存落库（rowid=${data.rowid || "?"}，${data.elapsed_s}s）`,
              "text-success"
            );
          } else {
            logLine(
              `❌ [${data.offer}] 未落库：${STAGE_NAME[data.failed_stage] || data.failed_stage || ""} ${data.note || ""}`,
              "text-danger"
            );
          }
          renderProducts();
        } else if (type === "batch_done") {
          logLine(
            `批次完成：成功 ${data.ok}，失败 ${data.fail}，耗时 ${data.elapsed_s}s`,
            "text-info"
          );
          loadCache(); // 这一批新攒的类目路径/属性选项刷出来
        } else if (type === "log") {
          const cls =
            data.level === "error"
              ? "text-danger"
              : data.level === "warning"
              ? "text-warning"
              : "";
          logLine(data.message || "", cls);
        } else if (type === "aborted") {
          logLine(`❌ 中止：${data.reason}`, "text-danger");
          showToast("发布中止", data.reason, "danger");
        }
      }

      function finishRun(summary) {
        if (evtSource) {
          evtSource.close();
          evtSource = null;
        }
        $("startSpinner").classList.add("d-none");
        $("statusText").textContent = "";
        $("btnStart").disabled = false;
        if (summary && (summary.ok != null || summary.fail != null)) {
          showToast(
            "批次结束",
            `成功 ${summary.ok ?? 0}，失败 ${summary.fail ?? 0}` +
              (summary.elapsed_s != null ? `，耗时 ${summary.elapsed_s}s` : ""),
            summary.fail ? "warning" : "success"
          );
        }
      }

      async function startBatch() {
        const tasks = parseTasks($("inputTasks").value);
        if (!tasks.length) {
          showToast("无法开始", "任务列表为空：每行填一个 1688 链接或 rowid|info_path", "warning");
          return;
        }
        // 店铺/站点在前端就拦住，不靠后端 aborted 事件：那要先建 job、连 SSE、
        // 再收一条中止事件，用户看到的是「跑了一下又挂了」而不是「有个字段没填」。
        // 站点没有默认值可兜——店小秘认领弹窗里没有「全球」这一项。
        const store = $("selStore").value;
        const site = $("selSite").value;
        if (!store) {
          showToast("无法开始", "请先选择店铺", "warning");
          return;
        }
        if (!site) {
          showToast("无法开始", "请先选择站点（店小秘没有「全球」站点）", "warning");
          return;
        }
        // 【开着自动发布时确认一次】⑮ 是全流程唯一不可逆的一步（真实商家账号，
        // 上架后要下架才能改）。开关默认开，故很可能是「没注意就跑了」——确认框是
        // 这个默认值的配套约束，不是多余摩擦。关掉开关就不问（只落库，可反复重跑）。
        if ($("chkDoPublish").checked) {
          const n = tasks.length;
          if (
            !confirm(
              `自动发布已开启：${n} 个商品在保存落库后会直接上架到「${store} / ${site}」。
` +
                "发布不可逆（上架后要下架才能改）。确认继续？"
            )
          ) {
            return;
          }
        }
        localStorage.setItem(LS_PRICE, $("inputPrice").value.trim());
        $("btnStart").disabled = true;
        $("startSpinner").classList.remove("d-none");
        $("statusText").textContent = "发布中…";
        products = {};
        renderProducts();
        try {
          const r = await fetch("/publish/batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              tasks,
              store,
              site,
              from_stage: $("selFromStage").value,
              use_cache: $("chkUseCache").checked,
              // 空串＝后端用默认 188.88。前端不做数字校验：归一与范围闸都在
              // pipeline.normalize_declare_price，那里非法值退默认并告警，
              // 在这里再拦一次只会多一套要同步维护的规则。
              price: $("inputPrice").value.trim(),
              // ⑮ 发布闸门。默认开（勾选状态即真相，不在这里另设默认值——
              // 两处各写一份默认会漂移）
              do_publish: $("chkDoPublish").checked,
            }),
          });
          const { job_id } = await r.json();
          evtSource = new EventSource(`/publish/batch/${job_id}/events`);
          [
            "batch_start",
            "product_start",
            "stage_start",
            "stage_done",
            "manual_check",
            "product_done",
            "batch_done",
            "log",
            "aborted",
          ].forEach((ev) =>
            evtSource.addEventListener(ev, (e) => onEvent(ev, JSON.parse(e.data)))
          );
          evtSource.addEventListener("done", (e) => {
            let summary = {};
            try {
              summary = JSON.parse(e.data);
            } catch (_) {}
            finishRun(summary);
          });
          evtSource.onerror = () => {
            // 流结束或断开：done 事件后浏览器会触发一次 error，忽略即可
            if (evtSource && evtSource.readyState === EventSource.CLOSED) finishRun();
          };
        } catch (e) {
          showToast("启动失败", String(e), "danger");
          finishRun();
        }
      }

      $("btnStart").addEventListener("click", startBatch);
    </script>
  </body>
</html>
